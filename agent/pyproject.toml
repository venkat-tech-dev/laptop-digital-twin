[project]
name = "ldt-agent"
version = "1.8.0"  # keep equal to AGENT_VERSION in app/runner.py (checked by a test)
description = "Laptop Digital Twin - host telemetry agent (Windows)"
requires-python = ">=3.12"
dependencies = [
    "psutil>=6.0",
    "pywin32>=306; sys_platform == 'win32'",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "cryptography>=43",  # verifies Ed25519-signed remediation envelopes (Phase 8)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-psutil",
    "types-pywin32",
]

[project.scripts]
ldt-agent = "app.main:run"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "S603", "S607", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["win32com.*", "pythoncom", "pywintypes", "win32pdh", "servicemanager", "win32serviceutil", "win32service", "win32event", "win32crypt", "win32evtlog"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.service.*"]
disallow_untyped_calls = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
