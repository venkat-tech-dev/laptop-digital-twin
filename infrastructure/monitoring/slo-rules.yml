# Phase 10 SLO recording and alerting rules (Prometheus 2.x). Load with:
#   rule_files: ["slo-rules.yml"]   (infrastructure/monitoring/prometheus.yml)
# Targets are PROPOSED (docs/operations/slo.md). Burn-rate alerts follow the multi-window pattern:
# fast burn = 14.4x budget over 1 h confirmed over 5 min (2 % of a 30-day budget per hour),
# slow burn = 6x over 6 h confirmed over 30 min.
groups:
  - name: ldt-slo-recording
    interval: 30s
    rules:
      # ---- API availability (non-5xx), excluding probes, metrics and unmatched paths
      - record: ldt:api_requests:rate5m
        expr: sum(rate(ldt_http_request_duration_seconds_count{route!~"/health.*|/metrics|unmatched"}[5m]))
      - record: ldt:api_errors:rate5m
        expr: sum(rate(ldt_http_request_duration_seconds_count{route!~"/health.*|/metrics|unmatched",status=~"5.."}[5m]))
      - record: ldt:api_error_ratio:rate5m
        expr: ldt:api_errors:rate5m / clamp_min(ldt:api_requests:rate5m, 1e-9)
      - record: ldt:api_error_ratio:rate30m
        expr: >
          sum(rate(ldt_http_request_duration_seconds_count{route!~"/health.*|/metrics|unmatched",status=~"5.."}[30m]))
          / clamp_min(sum(rate(ldt_http_request_duration_seconds_count{route!~"/health.*|/metrics|unmatched"}[30m])), 1e-9)
      - record: ldt:api_error_ratio:rate1h
        expr: >
          sum(rate(ldt_http_request_duration_seconds_count{route!~"/health.*|/metrics|unmatched",status=~"5.."}[1h]))
          / clamp_min(sum(rate(ldt_http_request_duration_seconds_count{route!~"/health.*|/metrics|unmatched"}[1h])), 1e-9)
      - record: ldt:api_error_ratio:rate6h
        expr: >
          sum(rate(ldt_http_request_duration_seconds_count{route!~"/health.*|/metrics|unmatched",status=~"5.."}[6h]))
          / clamp_min(sum(rate(ldt_http_request_duration_seconds_count{route!~"/health.*|/metrics|unmatched"}[6h])), 1e-9)
      # ---- device-state read latency: share within 250 ms
      - record: ldt:state_reads_fast_ratio:rate1h
        expr: >
          sum(rate(ldt_http_request_duration_seconds_bucket{route=~"/api/v1/devices/\\{device_id\\}/twin|/api/v1/device|/api/v1/twin",le="0.25"}[1h]))
          / clamp_min(sum(rate(ldt_http_request_duration_seconds_count{route=~"/api/v1/devices/\\{device_id\\}/twin|/api/v1/device|/api/v1/twin"}[1h])), 1e-9)
      # ---- ingest success (overload shedding counts as failure)
      - record: ldt:ingest_shed_ratio:rate1h
        expr: >
          sum(rate(ldt_ingest_rejected_total{reason="overloaded"}[1h]))
          / clamp_min(sum(rate(ldt_ingest_batches_total{result=~"accepted|duplicate"}[1h])) + sum(rate(ldt_ingest_rejected_total{reason="overloaded"}[1h])), 1e-9)
      # ---- processing latency: share of batches processed within 250 ms
      - record: ldt:ingest_processing_fast_ratio:rate1h
        expr: >
          sum(rate(ldt_pipeline_latency_ms_bucket{stage="server_processing",le="250.0"}[1h]))
          / clamp_min(sum(rate(ldt_pipeline_latency_ms_count{stage="server_processing"}[1h])), 1e-9)

  - name: ldt-slo-alerts
    rules:
      - alert: LdtApiErrorBudgetFastBurn
        expr: ldt:api_error_ratio:rate1h > (14.4 * 0.005) and ldt:api_error_ratio:rate5m > (14.4 * 0.005)
        labels: {severity: page, slo: api-availability}
        annotations:
          summary: API is burning its 99.5 % availability budget 14x too fast
          runbook: docs/operations/runbooks.md#api-errors--database-saturation
      - alert: LdtApiErrorBudgetSlowBurn
        expr: ldt:api_error_ratio:rate6h > (6 * 0.005) and ldt:api_error_ratio:rate30m > (6 * 0.005)
        for: 15m
        labels: {severity: ticket, slo: api-availability}
        annotations:
          summary: API availability budget burning 6x too fast over 6 h
          runbook: docs/operations/runbooks.md#api-errors--database-saturation
      - alert: LdtDeviceStateReadsSlow
        expr: ldt:state_reads_fast_ratio:rate1h < 0.95
        for: 15m
        labels: {severity: ticket, slo: device-state-latency}
        annotations: {summary: Fewer than 95 % of device-state reads within 250 ms over 1 h}
      - alert: LdtIngestShedding
        expr: ldt:ingest_shed_ratio:rate1h > (14.4 * 0.001)
        for: 5m
        labels: {severity: page, slo: ingest-success}
        annotations:
          summary: Ingestion is shedding telemetry (overloaded)
          runbook: docs/operations/runbooks.md#telemetry-ingestion-outage-or-overload
      - alert: LdtPersistenceLagging
        expr: ldt_persist_oldest_queued_age_seconds > 60
        for: 5m
        labels: {severity: page, slo: persistence-lag}
        annotations:
          summary: Accepted telemetry is waiting more than 60 s to be written
          runbook: docs/operations/runbooks.md#database-saturation-or-outage
      - alert: LdtPersistenceDropping
        expr: increase(ldt_persist_dropped_total[10m]) > 0
        labels: {severity: page, slo: persistence-lag}
        annotations:
          summary: Accepted samples were dropped before being written (queue full)
          runbook: docs/operations/runbooks.md#database-saturation-or-outage
      - alert: LdtNotificationBacklog
        expr: ldt_notification_oldest_due_seconds > 120
        for: 5m
        labels: {severity: page, slo: alert-delivery}
        annotations:
          summary: A notification has waited more than 2 minutes for delivery
          runbook: docs/operations/runbooks.md#notification-provider-outage
      - alert: LdtBackgroundLoopDown
        expr: ldt_background_task_up == 0 and increase(ldt_background_task_restarts_total[10m]) >= 5
        labels: {severity: page, slo: background-health}
        annotations:
          summary: "Background loop {{ $labels.task }} is crash-looping"
          runbook: docs/operations/runbooks.md#background-loop-crash-looping
      - alert: LdtAuditEventsDropped
        expr: increase(ldt_audit_events_dropped_total[1h]) > 0
        labels: {severity: ticket}
        annotations: {summary: Audit events were dropped (database unavailable for long)}
      - alert: LdtCrossTenantProbes
        expr: increase(ldt_cross_tenant_access_attempts_total[15m]) > 20
        labels: {severity: ticket}
        annotations:
          summary: Repeated cross-organization access attempts
          runbook: docs/operations/runbooks.md#suspected-tenant-isolation-incident
