# Phase 10 quality gates. Every job blocks a release unless marked "non-blocking" below.
# Release policy: docs/operations/release.md
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, types, unit, isolation, security)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -c requirements.lock -e ".[dev]"
      - run: ruff format --check app tests
      - run: ruff check app tests
      - run: mypy app
      - name: unit tests (includes tenant isolation, Phase 9 security, Phase 10 reliability)
        run: pytest tests -q -m "not integration"
      - name: tenant isolation suite (explicit gate)
        run: pytest tests/unit/test_tenant_isolation.py tests/unit/test_security_phase9.py tests/unit/test_fleet_api.py -q

  backend-integration:
    name: backend integration + migrations (real PostgreSQL/TimescaleDB, Redis)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env: {POSTGRES_USER: ldt, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: ldt_ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ldt -d ldt_ci" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://ldt:ci-only-password@127.0.0.1:5432/ldt_ci
      TEST_DATABASE_URL: postgresql+asyncpg://ldt:ci-only-password@127.0.0.1:5432/ldt_ci
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -c requirements.lock -e ".[dev]"
      - name: migrations from an empty database
        run: alembic upgrade head
      - name: migrations are reversible (one step down and up again)
        run: alembic downgrade -1 && alembic upgrade head
      - name: integration tests (persistence, leader election)
        run: pytest tests/integration -q -m integration

  agent:
    name: windows agent
    runs-on: windows-latest
    defaults: {run: {working-directory: agent}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -c requirements.lock -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app
      - run: pytest tests -q
      - name: python dependency audit (agent lock file; Windows-only wheels resolve here)
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --strict

  frontend:
    name: frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npx oxlint src
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build

  security:
    name: dependency and configuration scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: python dependency audit (backend lock file)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock --strict
      - name: npm audit (runtime dependencies, high and critical block)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - name: prometheus rules are valid
        run: docker run --rm -v "$PWD/infrastructure/monitoring:/m" --entrypoint promtool prom/prometheus:v2.53.0 check rules /m/slo-rules.yml
      - name: compose file is valid
        run: POSTGRES_PASSWORD=x docker compose config --quiet

  containers:
    name: container images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/backend.Dockerfile -t ldt-backend:${{ github.sha }} backend
      - run: docker build -f infrastructure/docker/frontend.Dockerfile -t ldt-frontend:${{ github.sha }} frontend
      - name: image vulnerability scan (non-blocking until the baseline is triaged)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.24.0
        with: {image-ref: "ldt-backend:${{ github.sha }}", severity: "CRITICAL,HIGH", exit-code: "1"}
